name: YonoLootZone CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f assets/app.js
          test -f assets/style.css
          test -f sitemap.xml
          test -f robots.txt

      - name: Check old domain/brand references
        shell: bash
        run: |
          set -e
          # Check website content only. Do not scan this workflow itself,
          # because the forbidden strings are necessarily present in its check pattern.
          if grep -RniE 'yonolooters\.com|Yono Games Hub|YonoLooters' . \
             --exclude-dir=.git \
             --exclude-dir=.github \
             --exclude='*.webp' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg'; then
            echo "ERROR: Old domain/brand reference found."
            exit 1
          fi

      - name: Validate sitemap
        shell: bash
        run: |
          set -e
          grep -q 'https://yonolootzone.com/' sitemap.xml
          test $(grep -c '<loc>' sitemap.xml) -ge 51

      - name: Validate robots.txt
        shell: bash
        run: |
          set -e
          grep -q 'Sitemap: https://yonolootzone.com/sitemap.xml' robots.txt
